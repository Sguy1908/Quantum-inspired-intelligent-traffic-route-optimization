# Start with a small configuration; replace sizes/runs only through a recorded config.
network_sizes: [20, 50, 100, 200, 300, 400, 500]
instances_per_size: 10
optimizer_seeds: [101, 202, 303, 404, 505]
base_instance_seed: 10000
max_evaluations: 5000
max_iterations: 1000
qpso_particles: 50
traffic_period: 240.0
traffic_c_max: 1.5
output_dir: results/research_benchmark
objective:
  distance_weight: 0.0
  travel_time_weight: 1.0
  congestion_weight: 0.0
